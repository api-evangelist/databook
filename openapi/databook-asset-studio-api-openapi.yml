      type: object
      required:
      - error
      title: ErrorResponseBodyRateLimitReached
    ErrorResponseBodyErrorObjectRateLimitReached:
      properties:
        type:
          type: string
          const: rate_limit_error
          title: Type
        message:
          type: string
          title: Message
      type: object
      required:
      - type
      - message
      title: ErrorResponseBodyErrorObjectRateLimitReached
    LibraryListItem:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        cta:
          anyOf:
          - type: string
          - type: 'null'
          title: Cta
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        level:
          $ref: '#/components/schemas/LibraryLevel'
      type: object
      required:
