aid: databook
name: Databook
description: 'Databook is an AI-powered decision system for enterprise sales teams, combining verified
  market intelligence with structured reasoning to give sellers visibility into their largest deals.
  The platform pairs an "Outside-In Radar" of signals beyond the CRM with an advanced reasoning engine,
  a dynamic Customer Context Graph modeling every buying group, guided sales agents tuned to specific
  KPIs, a CRO dashboard for leadership, and a Value Coach for executive narratives. It serves enterprise
  revenue organizations across cloud, cybersecurity, managed services, and software. Databook is a
  portfolio company of Bessemer Venture Partners and Threshold Ventures. It publishes a machine-readable
  REST API — the DatabookAI REST API, OpenAPI 3.1.0 at https://api.databook.com/openapi.json — exposing
  a catalog of 66 account-research insights, asynchronous CSV batch jobs that run those insights across
  many target accounts, a threaded chat endpoint, and a deep-reasoning endpoint that returns cited,
  structured analysis. Access is not self-serve: bearer tokens are provisioned by Databook support.'
